<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Siyasa</title></head>
<body><pre id="out">loading</pre><script type="module">
const r = await fetch("/api/worlds"); const list = await r.json();

</script></body></html>
